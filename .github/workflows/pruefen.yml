name: Prüfen

on:
  push:
  pull_request:

jobs:
  app:
    name: App bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://beispiel.supabase.co
          VITE_SUPABASE_ANON_KEY: nur-fuer-den-build

  datenbank:
    name: Datenbank testen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-Umgebung nachbilden
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
      - name: Migrationen einspielen
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Tests
        run: |
          psql -q -f supabase/tests/01_grundsystem_test.sql 2>&1 | tee ausgabe.txt
          grep -q "Bitte neu laden" ausgabe.txt || (echo "Versionsschutz fehlt"; exit 1)
          grep -q "Es existiert bereits ein Betrieb" ausgabe.txt || (echo "Ersteinrichtung nicht geschützt"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/02_lager_feldarbeiten_test.sql 2>&1 | tee ausgabe2.txt
          if grep -E "^ f +\|" ausgabe2.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe2.txt)" -ge 12 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "row-level security" ausgabe2.txt || (echo "Lagerbuchung durch Mitarbeiter nicht blockiert"; exit 1)
          grep -q "Keine Berechtigung, Arbeiten zu erfassen" ausgabe2.txt || (echo "Lesen-Rolle nicht blockiert"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/03_maschinen_felder_test.sql 2>&1 | tee ausgabe3.txt
          if grep -E "^ f +\|" ausgabe3.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe3.txt)" -ge 13 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "Der Teil muss kleiner sein" ausgabe3.txt || (echo "Teilen-Prüfung fehlt"; exit 1)
          grep -q 'policy for table "maschinen"' ausgabe3.txt || (echo "Maschinen-Rechte fehlen"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/04_auftraege_test.sql 2>&1 | tee ausgabe4.txt
          if grep -E "^ f +\|" ausgabe4.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe4.txt)" -ge 11 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "Auftrag ist bereits abgeschlossen" ausgabe4.txt || (echo "Doppeltes Abschliessen nicht verhindert"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/05_benutzer_test.sql 2>&1 | tee ausgabe5.txt
          if grep -E "^ f +\|" ausgabe5.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe5.txt)" -ge 9 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "mindestens ein aktiver Administrator" ausgabe5.txt || (echo "Letzter Admin nicht geschützt"; exit 1)
          grep -q "liegt keine Einladung vor" ausgabe5.txt || (echo "Fremde Konten nicht blockiert"; exit 1)
          grep -q "E-Mail-Adresse bestätigen" ausgabe5.txt || (echo "Unbestätigte Konten nicht blockiert"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/06_ernte_test.sql 2>&1 | tee ausgabe6.txt
          if grep -E "^ f +\|" ausgabe6.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe6.txt)" -ge 12 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "mehr Ballen abgegeben" ausgabe6.txt || (echo "Abgaben-Prüfung fehlt"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/07_papierkorb_test.sql 2>&1 | tee ausgabe7.txt
          if grep -E "^ f +\|" ausgabe7.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe7.txt)" -ge 7 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "bleibt archiviert" ausgabe7.txt || (echo "Archiv-Prüfung fehlt"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/08_kartenobjekte_test.sql 2>&1 | tee ausgabe8.txt
          if grep -E "^ f +\|" ausgabe8.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe8.txt)" -ge 4 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/09_aufgaben_test.sql 2>&1 | tee ausgabe9.txt
          if grep -E "^ f +\|" ausgabe9.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe9.txt)" -ge 9 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/10_ketten_test.sql 2>&1 | tee ausgabe10.txt
          if grep -E "^ f +\|" ausgabe10.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe10.txt)" -ge 7 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "Zuerst die vorherige Arbeit" ausgabe10.txt || (echo "Ketten-Prüfung fehlt"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/11_verkauf_test.sql 2>&1 | tee ausgabe11.txt
          if grep -E "^ f +\|" ausgabe11.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe11.txt)" -ge 10 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
      - name: Import der Fruchtfolge
        run: |
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -c "insert into public.betriebe (name) values ('Test')"
          for f in supabase/daten/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null; psql -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null; done
          [ "$(psql -tAc 'select count(*) from public.felder')" -eq 13 ] || (echo "Import: falsche Anzahl Felder"; exit 1)
      - name: Einrichtungsdatei aktuell?
        run: scripts/einrichtung_erstellen.sh | diff - supabase/einrichtung_komplett.sql || (echo "supabase/einrichtung_komplett.sql ist veraltet – scripts/einrichtung_erstellen.sh ausführen"; exit 1)
