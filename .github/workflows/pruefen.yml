name: Prüfen

on:
  push:
  pull_request:

jobs:
  app:
    name: App bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://beispiel.supabase.co
          VITE_SUPABASE_ANON_KEY: nur-fuer-den-build

  datenbank:
    name: Datenbank testen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-Umgebung nachbilden
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
      - name: Migrationen einspielen
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Tests
        run: |
          psql -q -f supabase/tests/01_grundsystem_test.sql 2>&1 | tee ausgabe.txt
          grep -q "Bitte neu laden" ausgabe.txt || (echo "Versionsschutz fehlt"; exit 1)
          grep -q "Es existiert bereits ein Betrieb" ausgabe.txt || (echo "Ersteinrichtung nicht geschützt"; exit 1)
          psql -c "drop schema public cascade; create schema public; drop schema auth cascade;"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -q -f supabase/tests/02_lager_feldarbeiten_test.sql 2>&1 | tee ausgabe2.txt
          if grep -E "^ f +\|" ausgabe2.txt; then echo "Ein Test ist fehlgeschlagen"; exit 1; fi
          [ "$(grep -cE '^ t +\|' ausgabe2.txt)" -ge 12 ] || (echo "Zu wenige erfolgreiche Tests"; exit 1)
          grep -q "row-level security" ausgabe2.txt || (echo "Lagerbuchung durch Mitarbeiter nicht blockiert"; exit 1)
          grep -q "Keine Berechtigung, Arbeiten zu erfassen" ausgabe2.txt || (echo "Lesen-Rolle nicht blockiert"; exit 1)
