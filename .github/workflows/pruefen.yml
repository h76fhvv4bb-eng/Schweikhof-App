name: Prüfen

on:
  push:
  pull_request:

jobs:
  app:
    name: App bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://beispiel.supabase.co
          VITE_SUPABASE_ANON_KEY: nur-fuer-den-build
      - name: PDF-Probe (Rechnung, Fruchtfolge, Parzellenblatt mit Testdaten)
        run: |
          npx esbuild scripts/pdf_probe.ts --bundle --platform=node --format=cjs --outfile=probe.cjs \
            --define:import.meta.env='{}' --external:canvg --external:html2canvas --external:dompurify
          node probe.cjs
      - name: Probe-PDFs im Zweig «pdf-probe» ablegen (zum Ansehen)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p /tmp/probe && cp probe_*.pdf /tmp/probe/
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan pdf-probe
          git rm -rfq --cached . > /dev/null
          git clean -fdxq -e probe.cjs
          cp /tmp/probe/*.pdf .
          git add probe_*.pdf
          git commit -qm "PDF-Probe ${GITHUB_SHA::7}"
          git push -qf origin pdf-probe

  datenbank:
    name: Datenbank testen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-Umgebung nachbilden
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_auth_stub.sql
      - name: Migrationen einspielen
